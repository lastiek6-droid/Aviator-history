<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sotik Fly - Demo Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0b0f1a;color:white;overflow-x:hidden}
.top-banner{background:#ffcc00;color:#000;text-align:center;padding:8px;font-weight:bold;font-size:14px}
.header{padding:15px;text-align:center;background:#111827}
.header h1{color:#ffcc00}
.game-area{background:#101828;margin:10px;border-radius:12px;height:320px;position:relative;overflow:hidden;border:2px solid #1f2937}
.plane{position:absolute;font-size:40px;left:20px;top:140px;transition:all 0.1s}
.multiplier-text{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:64px;font-weight:bold;color:#ff3b3b}
.graph-line{position:absolute;bottom:0;left:0;width:100%;height:100%}
.controls{padding:15px}
.bet-box{background:#1f2937;padding:15px;border-radius:10px;margin-bottom:12px}
.bet-box input{width:100%;padding:12px;border-radius:8px;border:none;margin:8px 0;font-size:16px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer}
.btn-bet{background:#22c55e;color:white}
.btn-cashout{background:#ef4444;color:white;display:none}
.btn-start{background:#ffcc00;color:black;margin-top:10px}
.history{display:flex;gap:6px;overflow-x:auto;padding:10px}
.history span{padding:5px 10px;border-radius:20px;font-size:12px;
