<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.2'><title>Aviator - SEE NEXT</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0f13;color:#fff;font-family:Arial;overflow:hidden}.topbar{background:#1b1c1d;padding:8px;display:flex;gap:6px;overflow-x:auto;border-bottom:2px solid #333}.topbar span{padding:6px 14px;border-radius:20px;font-weight:bold;font-size:14px}.b{background:#3498db}.p{background:#8e44ad}.r{background:#e74c3c}.next{background:#2ecc71;color:#000;animation:pulse 1s infinite;border:2px solid #fff}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}}.game{height:55vh;position:relative;background:radial-gradient(#1a1a2e,#121212)}canvas{width:100%;height:100%}#mult{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:72px;font-weight:900;text-shadow:0 0 20px #ff0033}#mult.crash{color:#ff0033;animation:shake .3s}.next-box{position:absolute;right:10px;top:10px;background:#111;padding:10px 15px;border-radius:10px;border:2px solid #2ecc71;text-align:center}#nextVal{font-size:22px;font-weight:bold;color:#2ecc71}.controls{padding:12px;background:#222;display:flex;gap:10px}.box{flex:1;background:#333;padding:12px;border-radius:12px}.btn{width:100%;padding:16px;background:#28a909;border:none;border-radius:12px;color:#fff;font-weight:bold;font-size:20px}.btn2{background:#f39c12;margin-top:8px}</style></head><body>
<div class='topbar' id='h'></div>
<div class='game'><canvas id='c'></canvas><div id='mult'>1.00x</div><div class='next-box'>NEXT FLY:<br><span id='nextVal'>2.50x</span><br><small style='color:#aaa'>will crash at</small></div></div>
<div class='controls'><div class='box'>BET: <input id='bet' value='10' style='width:60px;padding:6px'><button class='btn' onclick='cash()'>CASHOUT</button><button class='btn btn2' onclick='showNext()'>👁️ SHOW NEXT FLY</button><div style='margin-top:8px;font-size:12px;color:#aaa'>Balance: <span id='bal'>1000</span> | Win: <span id='win'>0</span></div></div></div>
<script>
let canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),W,H,mult=1,crash=2,nextCrash=2,run=false,trail=[],hist=[2.14,1.05,5.33,1.23,10.2,3.4,1.12],bal=1000,betting=false,betAmt=10;
function resize(){canvas.width=W=canvas.offsetWidth;canvas.height=H=canvas.offsetHeight}resize();window.onresize=resize;
function randCrash(){let r=Math.random();if(r<0.5)return +(Math.random()*1.5+1).toFixed(2);if(r<0.8)return +(Math.random()*3+2).toFixed(2);if(r<0.95)return +(Math.random()*10+5).toFixed(2);return +(Math.random()*50+10).toFixed(2);}
nextCrash=randCrash();
function drawHist(){document.getElementById('h').innerHTML='<span class=next> NEXT:'+nextCrash.toFixed(2)+'x </span>'+hist.slice(0,12).map(v=>'<span class='+(v<2?'b':v<10?'p':'r')+'>'+v.toFixed(2)+'x</span>').join('');document.getElementById('nextVal').textContent=nextCrash.toFixed(2)+'x';}
drawHist();
function start(){crash=nextCrash;nextCrash=randCrash();mult=1;trail=[];run=true;drawHist();let s=Date.now();let mEl=document.getElementById('mult');mEl.classList.remove('crash');
(function loop(){if(!run)return;let t=(Date.now()-s)/1000;mult=1+t*0.18+Math.pow(t,1.9)*0.05;if(mult>=crash){end();return}let x=Math.min(t*60,W-50),y=H-60-t*25-Math.pow(t,2)*2.5;trail.push({x,y});if(trail.length>60)trail.shift();ctx.clearRect(0,0,W,H);
ctx.strokeStyle='#222';for(let i=0;i<H;i+=30){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke()}
ctx.beginPath();ctx.moveTo(0,H-50);trail.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(x,H-50);ctx.fillStyle='rgba(255,0,71,0.15)';ctx.fill();
ctx.strokeStyle='#ff0033';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,H-50);trail.forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();
ctx.font='36px Arial';ctx.fillText('✈️',x-15,y-5);
mEl.textContent=mult.toFixed(2)+'x';mEl.style.color=mult<2?'#fff':mult<10?'#a55eea':'#ff0033';
requestAnimationFrame(loop)})()}
function end(){run=false;let m=document.getElementById('mult');m.textContent=crash.toFixed(2)+'x FLEW AWAY!';m.classList.add('crash');hist.unshift(crash);if(betting){betting=false;if(mult>=crash){} }setTimeout(()=>{start()},3000)}
function cash(){if(!run||!betting)return;let w=betAmt*mult;bal+=w;betting=false;document.getElementById('bal').textContent=Math.floor(bal);document.getElementById('win').textContent='+'+w.toFixed(2);alert('You cashed at '+mult.toFixed(2)+'x! Won '+w.toFixed(2));}
function showNext(){alert('🔮 NEXT FLY WILL CRASH AT: '+nextCrash.toFixed(2)+'x\n\nPlace bet low if next is low!');}
setTimeout(start,800);
</script></body></html>
