<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Aviator</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0f13;color:#fff;font-family:Arial;overflow:hidden}.topbar{background:#1b1c1d;padding:8px;display:flex;gap:6px;overflow-x:auto;border-bottom:2px solid #333}.topbar span{padding:6px 14px;border-radius:20px;font-weight:bold;font-size:14px}.b{background:#3498db}.p{background:#8e44ad}.r{background:#e74c3c}.game{height:62vh;position:relative;background:radial-gradient(#1a1a2e,#121212)}canvas{width:100%;height:100%}#mult{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:68px;font-weight:900}.hidden{display:none!important}</style></head><body><div class='topbar' id='h'></div><div class='game'><canvas id='c'></canvas><div id='mult'>1.00x</div></div><div id='secret' class='hidden' style='padding:12px;background:#222;border-top:3px solid #2ecc71'><div style='background:#111;border:2px solid #2ecc71;padding:12px;border-radius:12px;text-align:center'>OWNER MODE<br><br>NEXT: <b id='nextVal' style='color:#2ecc71;font-size:32px'>--</b><br><br><button onclick='alertNext()' style='width:100%;padding:14px;background:#f39c12;border:none;border-radius:10px;font-weight:bold'>SHOW NEXT FLY</button><div style='margin-top:14px;background:#333;padding:10px;border-radius:8px'><small style='color:#f1c40f'>FAKE DEPOSIT:</small><div style='display:flex;gap:6px;margin-top:8px'><button onclick='deposit(100)' style='flex:1;padding:12px;background:#3498db;border:none;border-radius:8px;color:#fff;font-weight:bold'>+100</button><button onclick='deposit(500)' style='flex:1;padding:12px;background:#3498db;border:none;border-radius:8px;color:#fff;font-weight:bold'>+500</button><button onclick='deposit(1000)' style='flex:1;padding:12px;background:#3498db;border:none;border-radius:8px;color:#fff;font-weight:bold'>+1000</button></div><div style='margin-top:8px'>Bal: <b id='bal' style='color:#2ecc71'>1000</b> <button onclick='hideAll()' style='float:right;background:#e74c3c;border:none;padding:6px 12px;border-radius:5px;color:#fff'>HIDE</button></div></div></div></div><script>let canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),W,H,mult=1,crash=2,nextCrash=2,run=false,trail=[],hist=[3.14,1.22,5.33,1.05,12.5,2.31,1.89,8.22],bal=1000,taps=0,PASS="Established123@2025#",owner=false;function resize(){canvas.width=W=canvas.offsetWidth;canvas.height=H=canvas.offsetHeight}resize();function randCrash(){let r=Math.random();if(r<0.5)return +(Math.random()*1.5+1).toFixed(2);if(r<0.8)return +(Math.random()*3+2).toFixed(2);if(r<0.95)return +(Math.random()*10+5).toFixed(2);return +(Math.random()*50+15).toFixed(2);}nextCrash=randCrash();function drawHist(){document.getElementById('h').innerHTML=hist.slice(0,15).map(v=>'<span class='+(v<2?'b':v<10?'p':'r')+'>'+v.toFixed(2)+'x</span>').join('')}drawHist();canvas.addEventListener('click',()=>{taps++;if(taps>=10){let p=prompt('OWNER PASSWORD:');if(p===PASS){owner=true;document.getElementById('secret').classList.remove('hidden');document.getElementById('nextVal').textContent=nextCrash.toFixed(2)+'x';alert('Owner mode ON!')}else{alert('Wrong password')}taps=0}setTimeout(()=>{taps=0},4000)});function alertNext(){alert('NEXT CRASH: '+nextCrash.toFixed(2)+'x')}function deposit(a){bal+=a;document.getElementById('bal').textContent=bal}function hideAll(){document.getElementById('secret').classList.add('hidden');owner=false}function start(){crash=nextCrash;nextCrash=randCrash();if(owner){document.getElementById('nextVal').textContent=nextCrash.toFixed(2)+'x'}mult=1;trail=[];run=true;let s=Date.now();let mEl=document.getElementById('mult');(function loop(){if(!run)return;let t=(Date.now()-s)/1000;mult=1+t*0.18+Math.pow(t,1.9)*0.05;if(mult>=crash){end();return}let x=Math.min(t*60,W-50),y=H-60-t*25-Math.pow(t,2)*2.5;trail.push({x,y});if(trail.length>60)trail.shift();ctx.clearRect(0,0,W,H);ctx.beginPath();ctx.moveTo(0,H-50);trail.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(x,H-50);ctx.fillStyle='rgba(255,0,71,0.15)';ctx.fill();ctx.strokeStyle='#ff0033';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,H-50);trail.forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();ctx.font='36px Arial';ctx.fillText('✈️',x-15,y-5);mEl.textContent=mult.toFixed(2)+'x';requestAnimationFrame(loop)})()}function end(){run=false;document.getElementById('mult').textContent=crash.toFixed(2)+'x FLEW AWAY!';hist.unshift(crash);drawHist();setTimeout(()=>{start()},2500)}setTimeout(start,800);</script></body></html>
