<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>DEMO</title><style>body{background:#0f0f13;color:#fff;font-family:Arial;margin:0}.topbar{background:#1b1c1d;padding:8px;display:flex;gap:6px;overflow-x:auto}.topbar span{padding:6px 14px;border-radius:20px;font-weight:bold;font-size:14px}.b{background:#3498db}.p{background:#8e44ad}.r{background:#e74c3c}.game{height:62vh;position:relative;background:radial-gradient(#1a1a2e,#121212);overflow:hidden}.warn{background:#facc15;color:#000;text-align:center;padding:6px;font-weight:700;font-size:12px}#mult{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:68px;font-weight:900;z-index:5}#plane{position:absolute;left:10%;top:55%;font-size:36px;z-index:6}#secret{position:absolute;bottom:0;width:100%;background:#222;border-top:3px solid #2ecc71;padding:12px;z-index:20}.hidden{display:none!important}.controls{padding:10px;background:#1b1c1d;display:flex;gap:8px}.btn{flex:1;padding:16px;border:none;border-radius:10px;font-weight:900}</style></head><body><div class=warn>⚠️ DEMO ONLY - FUN COINS - NO REAL MONEY</div><div class=topbar id=h></div><div class=game onclick="tapOwner()"><div id=mult>1.00x</div><div id=plane>✈️</div><div id=secret class=hidden><div style='background:#111;border:2px solid #2ecc71;padding:12px;border-radius:12px;text-align:center'>OWNER MODE 🔓<br><br>NEXT: <b id=nextVal style='color:#2ecc71;font-size:32px'>--</b><br><br><button onclick='alertNext()' style='width:100%;padding:14px;background:#f39c12;border:none;border-radius:10px;font-weight:bold'>SHOW NEXT FLY</button><div style='margin-top:10px;background:#333;padding:10px;border-radius:8px'>Bal: <b id=bal style='color:#2ecc71'>1000</b> <button onclick='deposit(500)' style='background:#3498db;border:none;padding:6px 10px;border-radius:5px;color:#fff;margin-left:10px'>+500 FAKE</button> <button onclick='hideAll()' style='float:right;background:#e74c3c;border:none;padding:6px 10px;border-radius:5px;color:#fff'>HIDE</button></div></div></div></div><div class=controls><button class=btn onclick="start()" style='background:#2ecc71;color:#fff'>BET 10</button><button class=btn onclick="cashout()" style='background:#e74c3c;color:#fff'>CASHOUT</button></div><div style='text-align:center;color:#666;font-size:11px;padding:6px'>Tap multiplier 5x fast for owner • Bal: <span id=bal2>1000</span> FUN</div><script>let mult=1,crash=2,nextCrash=2,run=false,hist=[3.14,1.22,5.33,1.05,12.5,2.31,1.89,8.22],bal=1000,taps=0,PASS="Established123@2025#",bet=10,iv;function randCrash(){let r=Math.random();if(r<0.5)return +(Math.random()*1.5+1).toFixed(2);if(r<0.8)return +(Math.random()*3+2).toFixed(2);if(r<0.95)return +(Math.random()*10+5).toFixed(2);return +(Math.random()*50+15).toFixed(2);}nextCrash=randCrash();function drawHist(){document.getElementById('h').innerHTML=hist.slice(0,15).map(v=>'<span class='+(v<2?'b':v<10?'p':'r')+'>'+v.toFixed(2)+'x</span>').join('')}drawHist();function start(){if(run)return;mult=1;crash=nextCrash;nextCrash=randCrash();document.getElementById('nextVal').innerText=nextCrash.toFixed(2)+'x';run=true;iv=setInterval(()=>{mult+=0.05+mult*0.012;document.getElementById('mult').innerText=mult.toFixed(2)+'x';document.getElementById('plane').style.left=(10+mult*3)+'%';document.getElementById('plane').style.top=(55-mult*2)+'%';if(mult>=crash){clearInterval(iv);run=false;hist.unshift(crash);drawHist();document.getElementById('mult').innerText='CRASH @ '+crash.toFixed(2)+'x 💥';setTimeout(start,2000)}},80)}function cashout(){if(!run)return;clearInterval(iv);run=false;let win=bet*mult;bal+=win;document.getElementById('bal').innerText=bal;document.getElementById('bal2').innerText=bal;hist.unshift(mult);drawHist();document.getElementById('mult').innerText='WIN @ '+mult.toFixed(2)+'x 🎉';setTimeout(start,2000)}function tapOwner(){taps++;setTimeout(()=>taps=0,2000);if(taps>=5){let p=prompt("Owner Password:");if(p===PASS){document.getElementById('secret').classList.remove('hidden');document.getElementById('nextVal').innerText=nextCrash.toFixed(2)+'x';}else if(p){alert("Wrong")}taps=0}}function alertNext(){alert("NEXT FLY: "+nextCrash.toFixed(2)+"x")}function deposit(a){bal+=a;document.getElementById('bal').innerText=bal;document.getElementById('bal2').innerText=bal}function hideAll(){document.getElementById('secret').classList.add('hidden')}start();</script></body></html>
