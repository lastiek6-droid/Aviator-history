<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kerry Aviator</title><style>body{background:#0f172a;color:white;font-family:Arial;text-align:center;margin:0;padding:20px}#game{background:#1e293b;border-radius:20px;padding:20px;max-width:400px;margin:auto}#multiplier{font-size:48px;font-weight:bold;color:#22c55e;margin:20px}#plane{font-size:50px}button{padding:15px 30px;font-size:18px;border-radius:10px;border:none;font-weight:bold;margin:10px}#betBtn{background:#22c55e;color:white}#cashBtn{background:#ef4444;color:white;display:none}#history{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:15px}.hist{padding:5px 10px;border-radius:5px;background:#334155;font-size:14px}</style></head><body><h1>✈️ Kerry Aviator</h1><div id="game"><div id="plane">✈️</div><div id="multiplier">1.00x</div><p id="status">Place bet to start!</p><button id="betBtn" onclick="startGame()">BET 10 KES</button><button id="cashBtn" onclick="cashOut()">CASHOUT</button><div id="history"></div></div><script>let mult=1,flying=false,crashed=false,interval,history=[];function startGame(){if(flying)return;mult=1;crashed=false;flying=true;document.getElementById('betBtn').style.display='none';document.getElementById('cashBtn').style.display='inline-block';document.getElementById('status').innerText='Flying...';document.getElementById('multiplier').style.color='#22c55e';let crashPoint=(Math.random()*5+1.1).toFixed(2);interval=setInterval(()=>{mult+=0.02+mult*0.005;document.getElementById('multiplier').innerText=mult.toFixed(2)+'x';document.getElementById('plane').style.transform=`translate(${mult*5}px, -${mult*2}px)`;if(mult>=crashPoint){crash();}},50);}function cashOut(){if(!flying||crashed)return;flying=false;clearInterval(interval);let win=(10*mult).toFixed(2);document.getElementById('status').innerText=`WON ${win} KES at ${mult.toFixed(2)}x!`;addHistory(mult,true);reset();}function crash(){crashed=true;flying=false;clearInterval(interval);document.getElementById('multiplier').style.color='#ef4444';document.getElementById('multiplier').innerText=mult.toFixed(2)+'x CRASHED';document.getElementById('status').innerText='Crashed! Try again';addHistory(mult,false);reset();}function addHistory(m,win){history.unshift({m:m.toFixed(2),win});if(history.length>10)history.pop();document.getElementById('history').innerHTML=history.map(h=>`<span class="hist" style="color:${h.win?'#22c55e':'#ef4444'}">${h.m}x</span>`).join('');}function reset(){setTimeout(()=>{document.getElementById('betBtn').style.display='inline-block';document.getElementById('cashBtn').style.display='none';document.getElementById('plane').style.transform='translate(0,0)';},1500);}</script></body></html>
